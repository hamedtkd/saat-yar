name: Validate Saatyar

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saatyar-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Quality and Vercel static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build the same static export used by Vercel
        run: npm run build:vercel
      - name: Verify Vercel publication contract
        run: npm run audit:vercel
